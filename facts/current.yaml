prompting:
  - id: prompt.reduce_rules
    value: "官方为 Claude Code 删除 80%+ 系统提示词，编码评测无可测损失"
    as_of: 2026-07-24
    tier: official
    source: "claude.dev《The new rules of context engineering for Claude 5 generation models》"
    note: "范围为常驻上下文（system prompt / CLAUDE.md / Skills），不等于否定一次性提示词的 few-shot"
  - id: prompt.then_now
    value:
      - "给规则 → 让模型用判断"
      - "给工具使用示例 → 设计接口（参数表达力）"
      - "全部前置 → 渐进披露"
      - "重复强调 → 指令只放工具描述"
      - "手动写 CLAUDE.md 记忆 → auto-memory"
      - "简单 markdown spec → rich references（HTML artifact / 测试套件 / rubric）"
    as_of: 2026-07-24
    tier: official
    source: "同上"
  - id: prompt.claude_md
    value: "轻量，只写仓库用途与 gotchas；不写 Claude 自己能看出来的 obvious；验证类指令拆成 skill 引用"
    as_of: 2026-07-24
    tier: official
    source: "同上"
  - id: prompt.skill_style
    value: "Skill 是轻量指南；避免过度约束；长 skill 拆多文件；Gotchas 段是最高信号内容"
    as_of: 2026-07-24
    tier: official
    source: "同上 + Thariq Shihipar《How we use skills》(2026-06-03)"
  - id: prompt.effort_first
    value: "效果不达预期先调 effort 再换模型；high 以上先比较「升一档」与「换更大模型」的成本"
